[package]
name = "apohara-desktop-dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apohara Catalyst desktop UI (Dioxus, Phase 2 canonical)"

[lib]
name = "apohara_desktop_dioxus"
path = "src/lib.rs"

[[bin]]
name = "apohara-desktop-dioxus"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["desktop"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "2.0"
apohara-dispatch = { path = "../apohara-dispatch" }
apohara-decomposer = { path = "../apohara-decomposer" }
apohara-token-accounting = { path = "../apohara-token-accounting" }
apohara-worktree = { path = "../apohara-worktree" }
apohara-verification = { path = "../apohara-verification" }
apohara-episodic = { path = "../apohara-episodic" }
# US-F0.1 — the desktop bootstraps the internal MCP bus on mount via
# `apohara_mcp::api::mcp_bootstrap_servers_inner` (idempotent, process-global).
apohara-mcp = { path = "../apohara-mcp" }
# Stage 2.6 — live agent-hooks bridge. The desktop starts the loopback
# hooks-server and subscribes to its broadcast channel; events are mapped
# straight from HookEventPayload (no apohara-hooks parser needed).
apohara-hooks-server = { path = "../apohara-hooks-server" }
uuid = { workspace = true }
futures-util = "0.3"
fuzzy-matcher = "0.3"
petgraph = "0.6"
# syntect default-features=false skips the `onig` native dep; we only need
# the pure-Rust `fancy-regex` path + the bundled default syntaxes/themes.
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
    "html",
] }
# alacritty_terminal powers the headless terminal state machine that backs
# TerminalPane (G2.D.1). We only use the Term + vte::ansi::Processor pair;
# no PTY, no event loop. Default `serde` feature is harmless and keeps the
# door open for snapshot tests later.
alacritty_terminal = "0.26"

[dev-dependencies]
dioxus-ssr = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
# Visual test harness (tests/ui_visual.rs). Pinned to the versions already
# resolved in the workspace Cargo.lock so they share the single wry/webkit
# instance the desktop binary links — bumping these would risk a duplicate
# native webview in the dependency graph.
wry = "=0.53.5"
webkit2gtk = "=2.0.1"
# webkit2gtk's `snapshot_future` returns a `cairo::Surface`. webkit2gtk does
# NOT re-export cairo (only ffi/gio/glib), so name the same cairo-rs it links
# (0.18.5 per Cargo.lock) directly. The `png` feature gates `Surface::write_to_png`;
# Cargo unifies it onto the shared crate so the snapshot type keeps the method.
cairo-rs = { version = "=0.18.5", features = ["png"] }
glib = "=0.18.5"
# A hidden tao window never assigns a physical size to the WebKit GtkWidget, so
# its viewport stays 0x0 and the grid's `1fr` track collapses. We force a fixed
# 1280x800 size_request on the webview widget (and pump the GTK main loop) so
# WebKit lays out against the real viewport. Needs gtk's WidgetExt. Pinned to
# the version webkit2gtk 2.0.1 already links.
gtk = "=0.18.2"
# Oneshot channel to ferry the snapshot result off glib's MainContext back into
# the dioxus future. Pinned to the version dioxus already resolves.
futures-channel = "0.3"

[[bench]]
name = "render_bench"
harness = false

# Visual, in-process UI snapshot harness. `harness = false` lets us own `main`
# (deadman switch + WEBKIT env setup before launch), mirroring the canonical
# dioxus-desktop headless_tests.
[[test]]
name = "ui_visual"
path = "tests/ui_visual.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"
