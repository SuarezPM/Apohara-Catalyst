[package]
name = "apohara-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
chrono = { workspace = true }
axum = "0.8"
tower = "0.5"
hyper = "1.5"
rand = "0.8"
hex = { workspace = true }
subtle = "2.5"
futures = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tempfile = "3"
# US-F4.3 — HTTP client for the external Context Forge compression sidecar.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
apohara-types = { path = "../apohara-types" }
apohara-mcp-bridge = { path = "../apohara-mcp-bridge" }
apohara-safety = { path = "../apohara-safety" }
apohara-episodic = { path = "../apohara-episodic" }
# Stage 2.6 — the hooks setup entry point installs the hook script via the
# installer (idempotent + atomic + chmod 0755). No cycle: apohara-hooks does
# not depend on apohara-mcp.
apohara-hooks = { path = "../apohara-hooks" }
# US-F2.0a — the concrete `MeshBackend` wraps the F0+F1 stores (ClaimStore /
# TaskGraph / Mailbox) so the `apohara.mesh` server goes live against real
# disk. No cycle: apohara-dispatch deps coordinator/secrets/token-accounting/
# types only — never apohara-mcp.
apohara-dispatch = { path = "../apohara-dispatch" }

[dev-dependencies]
criterion = "0.5"
serial_test = "3"
tokio = { workspace = true, features = ["test-util", "macros"] }

[[bench]]
name = "mcp_throughput"
harness = false
